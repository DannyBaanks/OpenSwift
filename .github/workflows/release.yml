name: Build and publish release

on:
  push:
    tags:
      - "v0.5"
      - "v0.5.*"
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundle: appimage
            artifact: OpenSwift-linux-x86_64.AppImage
            files: app/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            bundle: nsis
            artifact: OpenSwift-windows-x86_64.exe
            files: app/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential curl file libayatana-appindicator3-dev \
            libfuse2 libgtk-3-dev libssl-dev librsvg2-dev libxdo-dev wget \
            libwebkit2gtk-4.1-dev patchelf

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress

      - name: Install frontend dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Build installer
        working-directory: app
        run: bun run tauri build --bundles ${{ matrix.bundle }}

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p release-assets
          cp ${{ matrix.files }} "release-assets/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: sha256sum release-assets/OpenSwift-* > release-assets/SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" release-assets/* \
            --verify-tag \
            --title "OpenSwift $TAG_NAME" \
            --notes-file .github/release-notes/v0.5.md
