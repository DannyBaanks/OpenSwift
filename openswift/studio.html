<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenSwift Studio</title>
<style>
  :root {
    --bg: #f4f1ea;
    --panel: #fffdf8;
    --line: #e4ddd0;
    --ink: #1c1915;
    --muted: #8a8175;
    --accent: #111;
    --orange: #e36a1e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: 48px 1fr 28px; }
  header { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--line); }
  header strong { margin-right: 8px; }
  button, select { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: default; }
  #search { margin-left: auto; width: min(420px, 40vw); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; background: #fff; }
  main { display: grid; grid-template-columns: 48px 220px 1fr 340px; min-height: 0; }
  nav { border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 8px; }
  nav button { width: 34px; height: 34px; padding: 0; }
  nav button.on { background: #fff; border-color: #cfc6b8; }
  #side { border-right: 1px solid var(--line); overflow: auto; padding: 8px; background: #faf7f2; }
  #side h2 { font-size: 11px; letter-spacing: 0.08em; color: var(--muted); margin: 8px 4px; }
  .file { display: block; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 6px; padding: 5px 6px; }
  .file.on { background: #fff; }
  #editorwrap { display: grid; grid-template-rows: 36px 1fr 180px; min-width: 0; min-height: 0; }
  #tab { display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #code { width: 100%; height: 100%; border: 0; resize: none; padding: 12px 14px; font: 13px/1.5 ui-monospace, monospace; background: #fff; color: #241e18; }
  #dock { border-top: 1px solid var(--line); background: #fbf8f3; display: grid; grid-template-rows: 32px 1fr; min-height: 0; }
  #dock nav { flex-direction: row; border: 0; padding: 0 8px; align-items: end; gap: 4px; }
  #dock nav button { width: auto; height: auto; border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; }
  #dock nav button.on { border-bottom-color: var(--orange); }
  #dockpre { margin: 0; padding: 8px 12px; overflow: auto; font: 12px/1.45 ui-monospace, monospace; color: #4d463e; white-space: pre-wrap; }
  #stage { border-left: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; min-width: 0; }
  #stage .tools { display: flex; gap: 6px; }
  #phone { width: 230px; height: 470px; border: 8px solid #111; border-radius: 32px; background: #fff; overflow: hidden; box-shadow: 0 16px 40px rgba(0,0,0,.12); }
  #phone .bar { height: 22px; background: #111; }
  #phone .screen { height: calc(100% - 22px); overflow: auto; background: #000; }
  #phone svg { width: 100%; height: auto; display: block; }
  footer { display: flex; justify-content: space-between; align-items: center; padding: 0 12px; color: var(--muted); border-top: 1px solid var(--line); font-size: 12px; }
  #empty { color: var(--muted); padding: 24px; }
</style>
</head>
<body>
<header>
  <strong>OpenSwift Studio</strong>
  <button id="run" class="primary" disabled>Run</button>
  <button id="save" disabled>Save</button>
  <input id="search" placeholder="Filter files in this project" />
</header>
<main>
  <nav>
    <button class="on" title="Files">[]</button>
  </nav>
  <aside id="side"><h2>PROJECT</h2><div id="files"></div></aside>
  <section id="editorwrap">
    <div id="tab">No file</div>
    <textarea id="code" spellcheck="false" placeholder="Open a .swift file. Run draws the sketch. It does not compile."></textarea>
    <div id="dock">
      <nav>
        <button data-pane="debug" class="on">Debugger</button>
        <button data-pane="output">Output</button>
        <button data-pane="problems">Problems</button>
        <button data-pane="console">Console</button>
      </nav>
      <pre id="dockpre"></pre>
    </div>
  </section>
  <aside id="stage">
    <div class="tools">
      <button data-zoom="0.7">50%</button>
      <button data-zoom="0.85">75%</button>
      <button data-zoom="1">100%</button>
    </div>
    <div id="phone"><div class="bar"></div><div class="screen" id="screen"><div id="empty">Run to draw this file.</div></div></div>
  </aside>
</main>
<footer>
  <span id="project"></span>
  <span>approximate-web · not a Swift debugger</span>
</footer>
<script>
const project = "__PROJECT__";
const code = document.querySelector("#code");
const filesEl = document.querySelector("#files");
const tab = document.querySelector("#tab");
const screen = document.querySelector("#screen");
const dockpre = document.querySelector("#dockpre");
const search = document.querySelector("#search");
let current = "";
let files = [];
let pane = "debug";
const panes = { debug: "No Swift runtime.\nOpen a file and press Run.\nThe tree of the sketch shows up here. Breakpoints are not executed.", output: "", problems: "", console: "" };

document.querySelector("#project").textContent = project;

async function loadFiles() {
  const res = await fetch("/api/files");
  const data = await res.json();
  files = data.files;
  drawFiles();
}
function drawFiles() {
  const q = search.value.toLowerCase();
  filesEl.innerHTML = "";
  files.filter(f => f.toLowerCase().includes(q)).forEach(f => {
    const b = document.createElement("button");
    b.className = "file" + (f === current ? " on" : "");
    b.textContent = f;
    b.onclick = () => openFile(f);
    filesEl.appendChild(b);
  });
}
async function openFile(path) {
  const res = await fetch("/api/file?path=" + encodeURIComponent(path));
  const data = await res.json();
  if (data.error) { log("console", data.error); return; }
  current = path;
  code.value = data.text;
  tab.textContent = path;
  document.querySelector("#run").disabled = false;
  document.querySelector("#save").disabled = false;
  drawFiles();
  log("console", "opened " + path);
}
async function run() {
  const res = await fetch("/api/render", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ source: code.value }) });
  const data = await res.json();
  if (!data.ok) {
    panes.problems = data.error;
    panes.debug = data.error;
    showPane();
    log("output", "render failed: " + data.error);
    return;
  }
  screen.innerHTML = data.svg;
  panes.debug = "Sketch tree (not a call stack)\n\n" + fmt(data.tree, 0);
  panes.problems = data.problems.length ? data.problems.join("\n") : "No problems in the known views.";
  panes.output = "rendered " + current + "\nprovider approximate-web";
  showPane();
  log("console", "rendered " + (current || "buffer"));
}
function fmt(node, depth) {
  if (!node) return "";
  const pad = "  ".repeat(depth);
  const label = node.text ? " \"" + node.text + "\"" : "";
  return pad + node.kind + label + "\n" + (node.children || []).map(c => fmt(c, depth + 1)).join("");
}
function log(which, line) {
  panes[which] = (panes[which] ? panes[which] + "\n" : "") + line;
  if (pane === which) showPane();
}
function showPane() { dockpre.textContent = panes[pane]; }
document.querySelectorAll("#dock nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#dock nav button").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  pane = b.dataset.pane;
  showPane();
});
document.querySelector("#run").onclick = run;
document.querySelector("#save").onclick = async () => {
  if (!current) return;
  const res = await fetch("/api/save", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ path: current, text: code.value }) });
  const data = await res.json();
  log("console", data.ok ? "saved " + current : data.error);
};
search.oninput = drawFiles;
document.querySelectorAll("[data-zoom]").forEach(b => b.onclick = () => {
  document.querySelector("#phone").style.transform = "scale(" + b.dataset.zoom + ")";
  document.querySelector("#phone").style.transformOrigin = "top center";
});
code.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); run(); }
  if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); document.querySelector("#save").click(); }
});
showPane();
loadFiles();
</script>
</body>
</html>
