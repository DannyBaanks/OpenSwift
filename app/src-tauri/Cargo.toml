[package]
name = "openswift"
version = "0.5.0"
description = "OpenSwift Studio"
authors = ["DannyBaanks"]
edition = "2021"

[lib]
name = "openswift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
portable-pty = "0.9"
idevice = { version = "0.1.68", features = ["usbmuxd", "house_arrest", "afc", "core_device_proxy", "remote_pairing", "tcp", "tunnel_tcp_stack", "xpc", "rsd", "pair"] }
isideload = { version = "0.5.2", features = ["fs-storage"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
futures = "0.3"
tokio = { version = "1", features = ["rt", "sync", "time", "fs"] }
tokio-util = "0.7"
rootcause = "0.12"
thiserror = "2"
plist = "1.8"
reqwest = "0.13"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
